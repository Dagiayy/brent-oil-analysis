[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: marks tests that run real MCMC sampling (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "notebooks", "dashboard/frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
